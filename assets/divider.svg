<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E90FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)" filter="url(#glow)"/>
  <rect x="-160" y="10" width="160" height="4" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" from="-160" to="1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(600 12)" fill="#1E90FF" filter="url(#glow)">
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
