<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Futuristic animated banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E90FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E90FF" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#grid)"/>

  <!-- circuit lines -->
  <g fill="none" stroke="#1E90FF" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.85">
    <path d="M0 150 H180 L220 110 H420 L450 140 H640" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 70 H1010 L970 110 H780 L750 80 H600" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="96" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 190 H300 L330 170 H520" stroke="#58A6FF" stroke-opacity="0.6" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 30 H900 L870 50 H700" stroke="#58A6FF" stroke-opacity="0.6" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" from="0" to="72" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing nodes -->
  <g fill="#1E90FF" filter="url(#glow)">
    <circle cx="180" cy="150" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="110" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="140" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="70" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="110" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="80" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- central ring -->
  <g transform="translate(600 110)" fill="none" stroke="#1E90FF" filter="url(#glow)">
    <circle r="46" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="34" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="40 20">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" stroke="#58A6FF" stroke-width="2" stroke-dasharray="10 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#1E90FF" stroke="none">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scanning beam -->
  <rect x="-240" y="0" width="240" height="220" fill="url(#beam)">
    <animate attributeName="x" from="-240" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corners -->
  <g fill="none" stroke="#1E90FF" stroke-width="3" stroke-linecap="round">
    <path d="M20 50 V20 H50"/>
    <path d="M1150 20 H1180 V50"/>
    <path d="M20 170 V200 H50"/>
    <path d="M1150 200 H1180 V170"/>
  </g>

  <!-- HUD text -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" fill="#58A6FF">
    <text x="64" y="38">&gt; SYSTEM ONLINE</text>
    <text x="1136" y="38" text-anchor="end">v2026.11</text>
    <text x="64" y="192" opacity="0.8">RUNNING<animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="1136" y="192" text-anchor="end" opacity="0.8">&lt;/&gt;</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
